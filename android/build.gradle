// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Force Java 21 toolchain (auto-provisioned by Gradle) for all modules.
// Required because Capacitor 8 modules compile with source/target 21 while CI
// may only pin JDK 17. Requires the foojay resolver in settings.gradle.
subprojects {
    afterEvaluate {
        if (project.hasProperty('android') || project.name == 'app') {
            tasks.withType(JavaCompile).configureEach {
                javaCompiler.set(
                    project.getExtensions().getByType(org.gradle.jvm.toolchain.JavaToolchainService.class)
                        .compilerFor(org.gradle.jvm.toolchain.JavaLanguageVersion.of(21))
                )
            }
        }
    }
}
