// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Force Java 21 for every JavaCompile task (auto-provisioned toolchain via
// foojay resolver in settings.gradle). Capacitor 8 modules use source/target
// 21 even when CI pins an older JDK.
subprojects {
    def tc21 = org.gradle.jvm.toolchain.JavaLanguageVersion.of(21)
    tasks.withType(JavaCompile).configureEach { task ->
        javaCompiler.set(project.getExtensions().findByType(org.gradle.jvm.toolchain.JavaToolchainService)
            ?.compilerFor(tc21).orNull)
    }
}
