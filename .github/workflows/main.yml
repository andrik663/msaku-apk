name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor deps
        run: npm install --no-audit --no-fund

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/msaku-debug.apk

      - name: Upload artifact (setiap build)
        uses: actions/upload-artifact@v4
        with:
          name: msaku-apk-debug
          path: out/msaku-debug.apk
          if-no-files-found: error

      - name: Attach APK to release (hanya saat release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/msaku-debug.apk
